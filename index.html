<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Basic Streaming Page</title>
	<link rel="stylesheet" href="styles.css" />
</head>
<body>
	<main class="container">
		<h1>Basic Streaming Page</h1>

		<section class="preview">
			<div class="video-wrap">
				<video id="localVideo" autoplay playsinline muted></video>
				<video id="remotePlayback" controls></video>
			</div>
		</section>

		<section class="controls">
			<div class="row">
				<button id="startBtn">Start Camera</button>
				<button id="stopBtn" disabled>Stop Camera</button>
			</div>

			<div class="row">
				<label for="wsUrl">WebSocket URL (optional):</label>
				<input id="wsUrl" placeholder="wss://example.com/stream" />
				<button id="connectWsBtn">Connect WS</button>
				<button id="disconnectWsBtn" disabled>Disconnect WS</button>
			</div>

			<div class="row">
				<button id="startBroadcastBtn" disabled>Start Broadcast</button>
				<button id="stopBroadcastBtn" disabled>Stop Broadcast</button>
			</div>

			<p class="note">This page captures your camera/mic locally. If you provide a WebSocket server that accepts binary chunks, the page will send MediaRecorder blobs to it.</p>
		</section>
	</main>

	<script src="index.js"></script>
</body>
</html>
